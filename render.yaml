services:
  - type: web
    name: rimo-backend
    runtime: node
    region: singapore
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && node dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://rimo-couple.vercel.app
