version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: rimo_postgres
    environment:
      POSTGRES_DB: rimo_db
      POSTGRES_USER: rimo_user
      POSTGRES_PASSWORD: rimo_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: rimo_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
